name: Deploy SkyShift to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # every Monday: pick up new SPHEREx data releases
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh exposure lists for the featured targets (IRSA TAP)
        run: node tools/build-cache.js
        continue-on-error: true
        timeout-minutes: 15
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
